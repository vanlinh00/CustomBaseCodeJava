version: '3.8'


services:
  db:
    image: mysql:8.0
    container_name: mysql_local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: base_db
      MYSQL_DATABASE: base_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql



    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8g
        reservations:
          memory: 2g


volumes:
  mysql_data:

